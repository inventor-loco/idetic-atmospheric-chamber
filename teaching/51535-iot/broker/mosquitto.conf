# Broker Mosquitto para las prácticas de 51535.
#
# Arranque en primer plano, en un PC del laboratorio o en una Raspberry Pi
# que NO esté ejecutando el orquestador de la cámara:
#
#   mosquitto -c teaching/51535-iot/broker/mosquitto.conf
#
# No copies este fichero a /etc/mosquitto/conf.d/ de la Pi de la cámara.
# Un segundo listener 1883 chocaría con
# orchestrator/src/orchestrator/broker_config/mosquitto.conf, y el
# orquestador no debe ver tráfico de clase.
#
# Misma postura que la fase 0 de la cámara: anónimo, solo en la LAN
# del laboratorio. No abras el puerto al exterior.

listener 1883 0.0.0.0
allow_anonymous true
persistence false

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
