; Practica 1 — asignatura 51535.
; Mismo entorno que firmware/esp32-module (esp32dev_38p).
; El binario vale para ESP32-DEV-38P y ESP32-DEV-30P.

[platformio]
default_envs = esp32dev_38p

[env:esp32dev_38p]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
